name: Manual Release Pipeline 

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select Release Version Increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major


jobs:
  release-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Calculate Next Semantic Version
        id: version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force || true

          # Only valid semver tags: v1.2.3 (ignore bad tags like vv0.0.0)
          LATEST_TAG=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=0
            MINOR=0
            PATCH=0
          else
            CLEAN_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          fi

          BUMP_TYPE="${{ github.event.inputs.release_type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          # Keep NEW_VERSION with the v prefix; do not add another v later
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Latest tag: ${LATEST_TAG:-<none>}"
          echo "Target version for this release: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            sumegsharnagat04/ccm-backend:latest
            sumegsharnagat04/ccm-backend:${{ env.NEW_VERSION }}

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: ./UI
          file: ./UI/Dockerfile
          push: true
          tags: |
            sumegsharnagat04/ccm-ui:latest
            sumegsharnagat04/ccm-ui:${{ env.NEW_VERSION }}

      - name: Create and Push Git Tag to Main
        run: |
          TAG_NAME="${{ env.NEW_VERSION }}"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
            exit 1
          fi

          echo "Tagging main branch with: $TAG_NAME"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"